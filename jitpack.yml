# JitPack build configuration.
#
# JitPack compiles with OpenJDK 8 by default, which this build cannot use: the `kotlin-jvm` plugin
# requests a Java 17 toolchain and the Kotlin compiler targets JVM 17.
jdk:
  - openjdk17

# The default command is `./gradlew build publishToMavenLocal`; it is spelled out here so the publish
# target is explicit. Tests are skipped on purpose: CI and the release workflow both run the full
# suite, while JitPack only needs to produce artifacts, and a 15 minute build limit plus a flaky
# network should not be able to block a consumer from resolving the dependency.
install:
  - ./gradlew clean build publishToMavenLocal -x test
